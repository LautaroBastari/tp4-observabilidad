{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "gamecloud.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.prometheusRelease }}
spec:
  selector:
    matchLabels:
      {{- include "gamecloud.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
