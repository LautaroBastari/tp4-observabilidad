# loki 7.5.0 - modo monolítico (SingleBinary), filesystem, sin multi-tenancy
# helm upgrade --install loki grafana/loki --version 7.5.0 \
#   -n observabilidad -f observabilidad/values-loki.yaml

deploymentMode: SingleBinary

loki:
  auth_enabled: false          # sin multi-tenancy (no hace falta X-Scope-OrgID)
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Los componentes de los modos distribuidos van en 0
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Extras que no necesitamos en minikube (consumen RAM)
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
