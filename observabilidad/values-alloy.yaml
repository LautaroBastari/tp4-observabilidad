# alloy 1.14.2
# helm upgrade --install alloy grafana/alloy --version 1.14.2 \
#   -n observabilidad -f observabilidad/values-alloy.yaml
#
# Pipeline: discovery -> relabel -> source -> process -> write
alloy:
  configMap:
    create: true
    content: |
      // 1. Descubrir todos los pods del clúster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Pasar metadatos de Kubernetes a labels de Loki
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // 3. Leer los logs de cada pod (vía API de Kubernetes)
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.pods.receiver]
      }

      // 4. Solo para la API: parsear el JSON y agregar level como label
      loki.process "pods" {
        stage.match {
          selector = "{app=\"gamecloud-ranking\"}"

          stage.json {
            expressions = { level = "level" }
          }
          stage.labels {
            values = { level = "" }
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      // 5. Enviar a Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.observabilidad.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# minikube tiene un solo nodo: con el DaemonSet queda un único pod de Alloy
controller:
  type: daemonset
